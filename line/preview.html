:root{color-scheme:dark;--kti-accent:#3FB8AF;--kti-light:#3FB8AF;--kti-tint:#3FB8AF33;--kti-bg:#16181D}
body{margin:0;background:#16181D;color:#E6E8EC;font:13px/1.5 "IBM Plex Sans","PingFang SC",system-ui,sans-serif}
header{padding:28px 32px 4px}h1{font-size:22px;margin:0}h1 span{font-size:13px;color:#3FB8AF;font-weight:500;margin-left:8px}header p{color:#8A919C;margin:4px 0 0}
section{padding:12px 32px 20px;border-top:1px solid #23272E;margin-top:16px}.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:8px 0}
h2{font-size:15px;margin:0 12px 0 0}h2 code{font:12px ui-monospace,monospace;color:#8A919C;margin-left:6px}h3{font-size:12px;color:#8A919C;letter-spacing:.08em;margin:18px 0 8px}
.seg{display:flex;border:1px solid #2C3038;border-radius:7px;overflow:hidden}.seg button{background:#1B1E24;color:#B8BEC7;border:0;border-right:1px solid #2C3038;padding:5px 10px;font:inherit;cursor:pointer}.seg button:last-child{border:0}.seg button.on{background:#3FB8AF22;color:#3FB8AF}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 6px 10px;background:#1B1E24;border:1px solid #23272E;border-radius:10px}
.tile:hover{border-color:#3FB8AF55;background:#1E222A}.tile i{font:10.5px ui-monospace,monospace;color:#6F7782;font-style:normal}
